<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LASER-ROBOT — Nouveau mot de passe</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/style.css">
<style>
  body{display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 20px 60px #0006;padding:36px;max-width:400px;width:100%}
  .login-msg{font-size:.8rem;padding:10px 12px;border-radius:8px;margin-bottom:14px}
  .login-msg.error{background:var(--danger-pale);color:#ffd9dd}
  .login-msg.info{background:#113230;color:#8fe0cf}
</style>
</head>
<body>

<div class="login-card">
  <h1 style="font-size:1.2rem">Choisir un nouveau mot de passe</h1>
  <div id="msgBox"></div>
  <form id="resetForm">
    <div class="form-field">
      <label for="newPass">Nouveau mot de passe (8 caractères min.)</label>
      <div class="pw-wrap">
        <input type="password" id="newPass" required minlength="8" autocomplete="new-password">
        <button type="button" class="pw-toggle" data-target="newPass" aria-label="Afficher le mot de passe"></button>
      </div>
    </div>
    <button type="submit" class="btn" style="width:100%;justify-content:center">Enregistrer</button>
  </form>
</div>

<script src="assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/icons.js"></script>
<script>
document.querySelectorAll(".pw-toggle").forEach(function (btn) {
  btn.innerHTML = LaserIcons.svg("eye", 16);
  btn.addEventListener("click", function () {
    var input = document.getElementById(btn.getAttribute("data-target"));
    var showing = input.type === "text";
    input.type = showing ? "password" : "text";
    btn.innerHTML = LaserIcons.svg(showing ? "eye" : "eyeOff", 16);
  });
});

var msgBox = document.getElementById("msgBox");
function showMsg(text, kind) { msgBox.innerHTML = '<div class="login-msg ' + kind + '">' + text + "</div>"; }

document.getElementById("resetForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  var password = document.getElementById("newPass").value;
  var { error } = await window.laserSupabase.auth.updateUser({ password: password });
  if (error) { showMsg("Erreur : " + error.message, "error"); return; }
  showMsg("Mot de passe mis à jour. Redirection…", "info");
  setTimeout(function () { window.location.href = "accueil.html"; }, 1200);
});
</script>
</body>
</html>
