<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapports électeurs — LASER-ROBOT</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="app-shell" id="appShell">
  <main class="app-main">
    <div class="app-header">
      <p class="eyebrow">LASER-ROBOT · RAPPORTS</p>
      <h1>Rapports électeurs</h1>
      <p class="muted">Un rapport synthétique et un rapport détaillé par candidat, imprimables et partageables — profil, points forts documentés, engagements, lacunes, risques étayés par des éléments vérifiables et réponses du candidat.</p>
    </div>
    <div class="card">
      <div class="form-field" style="margin-bottom:16px">
        <label for="search">Rechercher un candidat par nom</label>
        <input type="text" id="search" placeholder="Ex. : Jerry Tardieu">
      </div>
      <div id="list"><div class="empty-state">Chargement…</div></div>
    </div>
  </main>
</div>

<script src="assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/icons.js"></script>
<script src="assets/shell.js"></script>
<script>
var all = [];
LaserAuth.requireSession().then(async function (session) {
  LaserShell.renderSidebar(session.profile, "rapports");
  var { data } = await laserSupabase.from("candidates").select("id, full_name, last_name, cep_status, biography").order("last_name").order("full_name");
  all = data || [];
  render(all);
  document.getElementById("search").addEventListener("input", function () {
    var q = this.value.trim().toLowerCase();
    render(all.filter(function (c) { return (c.full_name || "").toLowerCase().indexOf(q) !== -1; }));
  });
});

function render(list) {
  var box = document.getElementById("list");
  if (!list.length) { box.innerHTML = '<div class="empty-state">Aucun candidat trouvé.</div>'; return; }
  box.innerHTML = '<table class="data-table"><thead><tr><th>Nom</th><th>Statut CEP</th><th>Dossier</th><th></th></tr></thead><tbody>' +
    list.map(function (c) {
      return '<tr><td><b>' + escapeHtml(formatDisplayName(c.full_name, c.last_name)) + '</b></td>' +
        '<td><span class="status">' + escapeHtml(c.cep_status) + '</span></td>' +
        '<td>' + (c.biography ? '<span class="doc-type-chip">Documenté</span>' : '<span class="muted small">Pas encore documenté</span>') + '</td>' +
        '<td><a class="btn secondary icon-btn" href="rapport.html?id=' + c.id + '">' + LaserIcons.svg("report", 15) + ' Rapport</a></td></tr>';
    }).join("") + "</tbody></table>";
}

function formatDisplayName(fullName, lastName) {
  if (!lastName || !fullName) return fullName || "";
  var prenom = fullName;
  if (fullName.toLowerCase().indexOf(lastName.toLowerCase()) !== -1) {
    var idx = fullName.toLowerCase().lastIndexOf(lastName.toLowerCase());
    prenom = (fullName.slice(0, idx) + fullName.slice(idx + lastName.length)).trim();
  }
  return lastName.toUpperCase() + (prenom ? ", " + prenom : "");
}
function escapeHtml(s) { var d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }
</script>
</body>
</html>
